[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_lib"
version = "0.1.0a1"
description = "Personal Research Radar and RAG System — Track 1 backend (Phase 1A scaffolding)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "structlog>=24.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Phase 1A needs numpy + requests + pytest (requests powers the
# OpenAlexClient lookup path, already lifted from radar/openalex_lookup.py).
# Phase 1B adds embedding / ingestion / vector-index deps; they are kept
# separate so the 1A compliance suite can run in a slim environment and
# Track 2 can install without pulling model weights.
phase1b = [
    "pdfplumber>=0.11",
    "adapters>=0.2",
    "chromadb>=0.5",
    "ollama>=0.3",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_lib*"]
exclude = ["tests*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
